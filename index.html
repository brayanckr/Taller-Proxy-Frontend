<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor de Logs</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Monitor de Logs</h1>
      <p class="subtitle">Arquitectura de microservicios con patrón Proxy</p>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">
      <span class="dot" data-state="unknown"></span>
      <span id="status-text">Verificando conexión…</span>
    </div>
  </header>

  <main>
    <section class="architecture" aria-label="Flujo de la arquitectura">
      <span class="node">Microservicios emisores</span>
      <span class="arrow">→</span>
      <span class="node node-proxy">Proxy (puerto 4000)</span>
      <span class="arrow">→</span>
      <span class="node">Servicio de logs (puerto 4001)</span>
    </section>

    <section class="cards" id="level-cards" aria-label="Resumen por nivel"></section>

    <div class="grid">
      <section class="panel panel-wide">
        <div class="panel-head">
          <h2>Registros recibidos</h2>
          <label class="inline">
            <input type="checkbox" id="auto-refresh" checked>
            Actualizar cada 3 s
          </label>
        </div>

        <form class="filters" id="filters">
          <label>Nivel
            <select name="level">
              <option value="">Todos</option>
              <option>DEBUG</option>
              <option>INFO</option>
              <option>WARN</option>
              <option>ERROR</option>
              <option>FATAL</option>
            </select>
          </label>
          <label>Servicio
            <select name="service">
              <option value="">Todos</option>
              <option>auth-service</option>
              <option>payments-service</option>
              <option>orders-service</option>
            </select>
          </label>
          <label class="grow">Buscar en el mensaje
            <input type="search" name="search" placeholder="Ej. timeout">
          </label>
        </form>

        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Fecha</th><th>Nivel</th><th>Servicio</th><th>Mensaje</th></tr>
            </thead>
            <tbody id="logs-body"></tbody>
          </table>
          <p class="empty" id="logs-empty" hidden>No hay registros con estos filtros.</p>
        </div>
      </section>

      <aside class="side">
        <section class="panel">
          <h2>Enviar un log de prueba</h2>
          <form id="send-form" class="stack">
            <label>Servicio emisor
              <select name="producer"></select>
            </label>
            <label>Nivel
              <select name="level">
                <option>DEBUG</option>
                <option selected>INFO</option>
                <option>WARN</option>
                <option>ERROR</option>
                <option>FATAL</option>
              </select>
            </label>
            <label>Mensaje
              <textarea name="message" rows="3" required maxlength="1000" placeholder="Ej. password=1234 fallo al iniciar sesión"></textarea>
            </label>
            <button type="submit">Enviar a través del proxy</button>
          </form>
          <div class="actions">
            <button type="button" class="secondary" id="burst">Enviar ráfaga de 10</button>
            <button type="button" class="secondary" id="bad-key">Probar clave inválida</button>
          </div>
          <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
        </section>

        <section class="panel">
          <h2>Qué hizo el proxy</h2>
          <dl class="metrics" id="metrics"></dl>
        </section>
      </aside>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
